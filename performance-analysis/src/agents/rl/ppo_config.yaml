environment:
  microservices_num: 8
  nodes_num: 3
  reward_type: "proportional_fairness"
  observation_type: "normalized_complex"
  alpha: 0.5
  beta: 0.5

workloads:
  workloads: ["quizzes/semester_start_wl.py"]
  # Interval of min, max users per workload
  users: [80, 80]
  # Interval for dynamic read/write workload multipliers
  weights_ratio: [1, 1]
  # Interval for wait time in seconds between requests
  wait_time: [0.1, 0.1]
  # Each workload (step) runs for this exact time regardless of the requests processed
  run-time: 0 # seconds
  # Each workload (step) executes this amount of tasks
  iterations: [100, 100]
  # NOTE: If you want to use iterations instead of run-time, simply set 'run-time: 0'

ppo_hyperparameters:
  learning_rate: 0.0003
  use_linear_rate_decay: true
  gamma: 0.99
  ent_coef: 0.0
  n_steps: 160 # Steps per env before update
  batch_size: 192 # n_steps * num_envs / N_batches
  n_epochs: 10
  clip_range: 0.2

training:
  num_envs: 12
  steps_per_episode: 16
  total_timesteps: 57600
  checkpoint_freq: 1600 # Total steps to checkpoint
  # NOTE: If you want to resume from a checkpoint uncomment and replace the line bellow
  #resume_from_checkpoint: "./models/checkpoints/ppo_model_5376_steps.zip"

paths:
  models_dir: "./models/"
  checkpoints_dir: "./models/checkpoints/"
  tensorboard_log: "./tensorboard_logs/"
