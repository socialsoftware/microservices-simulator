environment:
  microservices_num: 8
  nodes_num: 3
  reward_type: "logarithmic_penalty"
  observation_type: "normalized_complex"
  alpha: 0.5
  beta: 0.5

workloads:
  workloads: ["quizzes/steady_2_wl.py"]
  # Interval of min, max users per workload
  users: [100, 100]
  # Interval for dynamic read/write workload multipliers
  weights_ratio: [1, 1]
  # Interval for wait time in seconds between requests
  wait_time: [0.1, 0.1]
  # Each workload (step) runs for this exact time regardless of the requests processed
  run-time: 0 # seconds
  # Each workload (step) executes this amount of tasks
  iterations: [150, 150]
  # NOTE: If you want to use iterations instead of run-time, simply set 'run-time: 0'

ppo_hyperparameters:
  learning_rate: 0.0002
  use_linear_rate_decay: False
  gamma: 0.90
  ent_coef: 0.02
  n_steps: 32 # Steps per env before update
  batch_size: 80 # n_steps * num_envs / N_batches
  n_epochs: 10
  clip_range: 0.2

training:
  num_envs: 10
  steps_per_episode: 16
  total_timesteps: 15000
  checkpoint_freq: 320
  # NOTE: If you want to resume from a checkpoint uncomment and replace the line bellow
  resume_from_checkpoint: "./models/checkpoints/ppo_model_15040_steps.zip"

paths:
  models_dir: "./models/"
  checkpoints_dir: "./models/checkpoints/"
  tensorboard_log: "./tensorboard_logs/"
