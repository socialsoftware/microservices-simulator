site_name: Verifier Handbook
site_description: Current verifier behavior, evidence, roadmap, and durable design rationale.
docs_dir: docs/verifiers-impl
site_dir: target/verifier-docs-site
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
nav:
  - Start: README.md
  - Current State: current-state.md
  - Roadmap: roadmap.md
  - Decisions:
      - Overview: decisions/index.md
      - Domain Service vs Coordination Facade: decisions/2026-04-06-domain-service-vs-coordination-facade.md
      - Static Package vs Dynamic Evidence: decisions/2026-04-28-hybrid-static-dynamic-key-binding.md
      - Conflict-Anchor Segment Compression: decisions/2026-06-16-conflict-anchor-segment-compression.md
      - Compensation-Aware v3 Contract: decisions/2026-07-19-compensation-aware-fault-scenario-contract.md
      - Event-Consequence Replay Contract: decisions/2026-07-30-deterministic-event-consequence-replay.md
plugins:
  - search
markdown_extensions:
  - admonition
  - toc:
      permalink: true
